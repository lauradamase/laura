<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée | Laura Damase</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">

    <!-- Theme Color -->
    <meta name="theme-color" content="#800020">

    <style>
        :root {
            --color-background: #F5F5F5;
            --color-text-primary: #1A1A1A;
            --color-accent: #800020;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--color-background);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .logo {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: var(--color-accent);
            margin-bottom: 2rem;
            text-decoration: none;
        }

        .logo:hover {
            opacity: 0.8;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: var(--color-accent);
            line-height: 1;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        p {
            font-size: 1rem;
            color: #4A4A4A;
            margin-bottom: 2rem;
            max-width: 400px;
        }

        .back-link {
            display: inline-block;
            padding: 0.75rem 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--color-text-primary);
            border: 2px solid var(--color-text-primary);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background-color: var(--color-accent);
            border-color: var(--color-accent);
            color: #fff;
        }
    </style>
</head>
<body>
    <a href="./" class="logo">Laura Damase</a>
    <div class="error-code">404</div>
    <h1>Page non trouvée</h1>
    <p>Désolé, la page que vous recherchez n'existe pas ou a été déplacée.</p>
    <a href="./" class="back-link">Retour à l'accueil</a>
</body>
</html>
