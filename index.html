<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Laura Damase - Réalisatrice & Filmmaker. Portfolio de documentaires et reportages pour France 2, 13h15.">
    <title>Laura Damase | Réalisatrice & Filmmaker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Laura Damase | Réalisatrice & Filmmaker">
    <meta property="og:description" content="Portfolio de documentaires et reportages pour France Télévisions par Laura Damase.">
    <meta property="og:image" content="https://www.franceinfo.fr/pictures/QXgAkLvjQvqING_r3yHVfdhCtp0/1200x675/2025/07/17/13h15-250803-l-homme-et-la-vallee-6879031710fa6738414081.png">
    <meta property="og:url" content="https://lauradamase.github.io/laura/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    <!-- Theme Color -->
    <meta name="theme-color" content="#800020">
</head>
<body>
    <!-- Vimeo Background Video -->
    <div class="video-background" id="videoBg">
        <iframe id="vimeoIframe" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture"></iframe>
    </div>

    <!-- Navigation Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo-container">
                <a href="./" class="logo">
                    <span class="logo-first">Laura</span>
                    <span class="logo-last">Damase</span>
                </a>
                <p class="subtitle">RÉALISATRICE & FILMMAKER</p>
            </div>

            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">
                <span class="hamburger"></span>
            </button>

            <ul class="nav-links" id="navLinks">
            </ul>

            <div class="social-icons">
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content landing-content" id="mainContent">
        <div class="logo-container" id="landingLogo">
            <a href="./" class="logo">
                <span class="logo-first">Laura</span>
                <span class="logo-last">Damase</span>
            </a>
            <p class="subtitle">RÉALISATRICE & FILMMAKER</p>
        </div>

        <!-- Portfolio Grid - Hidden until category is selected -->
        <section class="portfolio-grid" id="portfolioGrid" style="display: none;">
        </section>
    </main>

    <!-- JavaScript -->
    <script src="./js/main.js"></script>
    <script>
        (function() {
            var iframe = document.getElementById('vimeoIframe');
            var startTime = null;
            var videoStopped = false;

            function stopVideo() {
                var url = iframe.src;
                url = url.replace('&autoplay=1', '&autoplay=0');
                iframe.src = url;
                videoStopped = true;
            }

            iframe.src = 'https://player.vimeo.com/video/688364895?background=1&autopause=0&autoplay=1&muted=1&loop=1#t=16m20s';

            var checkInterval = setInterval(function() {
                if (videoStopped) {
                    clearInterval(checkInterval);
                    return;
                }
                if (startTime === null) {
                    startTime = Date.now();
                }
                if (Date.now() - startTime >= 30000) {
                    stopVideo();
                    clearInterval(checkInterval);
                }
            }, 100);

            var videoBg = document.getElementById('videoBg');
            var navLinks = document.querySelectorAll('.nav-link[data-filter]');
            navLinks.forEach(function(link) {
                link.addEventListener('click', function() {
                    videoBg.style.display = 'none';
                });
            });
        })();
    </script>

</body>
</html>
