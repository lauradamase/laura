<!DOCTYPE html>

    <!-- Open Graph / Social Media -->

            </div>

            <!-- Mobile Menu Toggle -->
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">
                <span class="hamburger"></span>

            <!-- Navigation Links -->
            <ul class="nav-links" id="navLinks">
                <li><a href="#" class="nav-link active" data-filter="all">SÉLECTION</a></li>
                <li><a href="#" class="nav-link" data-filter="documentaires">DOCUMENTAIRES</a></li>

                </a>
                <a href="https://www.linkedin.com/in/laura-damase-89477b84/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn">

    <main class="main-content">

        <section class="portfolio-grid" id="portfolioGrid">
            <!-- Loading indicator -->
            <p class="loading-message" style="grid-column: 1/-1; text-align: center; padding: 2rem; color: #666;">
                Chargement...

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p class="copyright">
                    <span class="accent">&copy;</span> <span class="accent">Laura Damase</span> 2025

    <script src="./js/main.js"></script>
