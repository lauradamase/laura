<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio de documentaires et reportages pour France Télévisions par Laura Damase.">
    <title>Laura Damase | Réalisatrice & Cheffe Opératrice</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Laura Damase | Réalisatrice &amp; Cheffe Opératrice">
    <meta property="og:description" content="Portfolio de documentaires et reportages pour France Télévisions par Laura Damase.">
    <meta property="og:image" content="https://www.lauradamase.com/images/og-preview.jpg">
    <meta property="og:url" content="https://www.lauradamase.com/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    <!-- Theme Color -->
    <meta name="theme-color" content="#800020">
</head>
<body>
    <!-- Video Background (dual video for seamless crossfade) -->
    <div class="video-background" id="videoBg">
        <video id="bgVideo1" muted playsinline preload="auto"></video>
        <video id="bgVideo2" muted playsinline preload="auto"></video>
    </div>

    <!-- Navigation Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo-container">
                <a href="./" class="logo">
                    <span class="logo-first">Laura</span>
                    <span class="logo-last">Damase</span>
                </a>
                <p class="subtitle">RÉALISATRICE & FILMMAKER</p>
            </div>

            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">
                <span class="hamburger"></span>
            </button>

            <ul class="nav-links" id="navLinks">
            </ul>

            <div class="social-icons">
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content landing-content" id="mainContent">
        <div class="logo-container" id="landingLogo">
            <a href="./" class="logo">
                <span class="logo-first">Laura</span>
                <span class="logo-last">Damase</span>
            </a>
            <p class="subtitle">RÉALISATRICE & FILMMAKER</p>
        </div>

        <section class="portfolio-grid" id="portfolioGrid" style="display: none;">
        </section>

        <section class="about-section" id="aboutSection" style="display: none;">
            <div class="about-container">
                <div class="about-image">
                    <img src="./images/laura.jpg" alt="Laura Damase" class="portrait-image">
                </div>
                <div class="about-content">
                    <h1 class="about-title">À Propos</h1>
                    <div class="about-text" id="aboutText">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Video Modal -->
    <div id="videoModal" class="video-modal" aria-hidden="true">
        <div class="video-modal-content">
            <button class="video-modal-close" aria-label="Fermer">&times;</button>
            <div class="video-modal-player" id="videoModalPlayer"></div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="./js/main.js"></script>
    <script>
        (function() {
            var videoBg = document.getElementById('videoBg');
            var vids = [
                document.getElementById('bgVideo1'),
                document.getElementById('bgVideo2')
            ];

            // Local video clips: path, duration in seconds
            var playlist = [
                { src: './videos/clip1_yt_final.mp4',  dur: 5  },
                { src: './videos/clip2_final.mp4',      dur: 4  },
                { src: './videos/clip3_v688.mp4',       dur: 23 },
                { src: './videos/clip4_final.mp4',      dur: 4  },
                { src: './videos/clip5_final.mp4',      dur: 9  }
            ];

            var FADE_MS = 500;
            var active  = 0;   // which vids[] slot is currently visible
            var curIdx  = 0;   // which playlist entry is in the active slot
            var timer   = null;

            function tryPlay(vid) {
                var p = vid.play();
                if (p) p.catch(function() {});
            }

            /* Schedule the crossfade FADE_MS before the clip ends */
            function scheduleNext(vid) {
                function go() {
                    var dur = vid.duration;
                    if (!dur || !isFinite(dur) || dur < 0.5) return;
                    if (timer) clearTimeout(timer);
                    timer = setTimeout(doAdvance, Math.max(50, Math.round(dur * 1000) - FADE_MS));
                }
                if (vid.readyState >= 1) {
                    go();
                } else {
                    vid.addEventListener('loadedmetadata', function h() {
                        vid.removeEventListener('loadedmetadata', h);
                        go();
                    });
                }
            }

            function doAdvance() {
                switchTo((curIdx + 1) % playlist.length);
            }

            function switchTo(newIdx) {
                var newSlot = 1 - active;
                var oldVid  = vids[active];
                var newVid  = vids[newSlot];

                // Load if not already loaded for this clip
                if (newVid.dataset.idx !== String(newIdx)) {
                    newVid.src = playlist[newIdx].src;
                    newVid.dataset.idx = newIdx;
                    newVid.load();
                }
                newVid.currentTime = 0;
                tryPlay(newVid);

                // Crossfade: bring new in, let old fade out
                newVid.classList.add('active');
                setTimeout(function() {
                    oldVid.classList.remove('active');
                    oldVid.pause();
                    // Preload the clip after next
                    var preIdx = (newIdx + 1) % playlist.length;
                    if (oldVid.dataset.idx !== String(preIdx)) {
                        oldVid.src = playlist[preIdx].src;
                        oldVid.dataset.idx = preIdx;
                        oldVid.load();
                    }
                }, FADE_MS);

                active = newSlot;
                curIdx = newIdx;
                scheduleNext(newVid);
            }

            // Stop timer when video section starts fading out (opacity set to 0 or display none)
            var observer = new MutationObserver(function() {
                var hiding = videoBg.style.display === 'none' || videoBg.style.opacity === '0';
                if (hiding && timer) {
                    clearTimeout(timer);
                    timer = null;
                }
            });
            observer.observe(videoBg, { attributes: true, attributeFilter: ['style'] });

            // Keyboard navigation (arrow keys cycle through clips)
            document.addEventListener('keydown', function(e) {
                if (videoBg.style.display === 'none') return;
                if (e.key === 'ArrowRight') {
                    if (timer) clearTimeout(timer);
                    switchTo((curIdx + 1) % playlist.length);
                } else if (e.key === 'ArrowLeft') {
                    if (timer) clearTimeout(timer);
                    switchTo((curIdx - 1 + playlist.length) % playlist.length);
                }
            });

            // Boot: load clip 0 into slot 0, preload clip 1 into slot 1
            vids[0].src = playlist[0].src;
            vids[0].dataset.idx = '0';
            vids[0].load();
            tryPlay(vids[0]);
            vids[0].classList.add('active');
            scheduleNext(vids[0]);

            vids[1].src = playlist[1].src;
            vids[1].dataset.idx = '1';
            vids[1].load();
        })();
    </script>

</body>
</html>
