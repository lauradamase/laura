<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Laura Damase - Réalisatrice & Filmmaker. Portfolio de documentaires et reportages pour France 2, 13h15.">
    <title>Laura Damase | Réalisatrice & Filmmaker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Laura Damase | Réalisatrice & Filmmaker">
    <meta property="og:description" content="Portfolio de documentaires et reportages pour France Télévisions par Laura Damase.">
    <meta property="og:image" content="https://www.franceinfo.fr/pictures/QXgAkLvjQvqING_r3yHVfdhCtp0/1200x675/2025/07/17/13h15-250803-l-homme-et-la-vallee-6879031710fa6738414081.png">
    <meta property="og:url" content="https://lauradamase.github.io/laura/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    <!-- Theme Color -->
    <meta name="theme-color" content="#800020">
</head>
<body>
    <!-- Video Background Carousel -->
    <div class="video-carousel" id="videoCarousel">
        <div class="video-carousel-track" id="videoTrack">
            <!-- Video 1: YouTube -->
            <div class="video-carousel-item active" data-index="0">
                <iframe id="video1" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" data-src="https://www.youtube-nocookie.com/embed/uSwd2NAgF-E?start=86&end=91&autoplay=1&mute=1&loop=0&playsinline=1"></iframe>
            </div>
            <!-- Video 2: Vimeo -->
            <div class="video-carousel-item" data-index="1">
                <iframe id="video2" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" data-src="https://player.vimeo.com/video/1015174528?background=1&autopause=0&autoplay=1&muted=1&loop=0#t=120,124"></iframe>
            </div>
            <!-- Video 3: Vimeo (existing) -->
            <div class="video-carousel-item" data-index="2">
                <iframe id="video3" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" data-src="https://player.vimeo.com/video/688364895?background=1&autopause=0&autoplay=1&muted=1&loop=0#t=980,985"></iframe>
            </div>
            <!-- Video 4a: Vimeo segment 1 (14'06-14'10) -->
            <div class="video-carousel-item" data-index="3">
                <iframe id="video4a" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" data-src="https://player.vimeo.com/video/689078465?background=1&autopause=0&autoplay=1&muted=1&loop=0#t=846,850"></iframe>
            </div>
            <!-- Video 4b: Vimeo segment 2 (17'03-17'12) -->
            <div class="video-carousel-item" data-index="4">
                <iframe id="video4b" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" data-src="https://player.vimeo.com/video/689078465?background=1&autopause=0&autoplay=1&muted=1&loop=0#t=1023,1032"></iframe>
            </div>
        </div>
        <!-- Navigation dots -->
        <div class="video-carousel-dots" id="carouselDots"></div>
        <!-- Navigation arrows -->
        <button class="video-carousel-arrow prev" id="carouselPrev" aria-label="Vidéo précédente">‹</button>
        <button class="video-carousel-arrow next" id="carouselNext" aria-label="Vidéo suivante">›</button>
    </div>

    <!-- Navigation Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo-container">
                <a href="./" class="logo">
                    <span class="logo-first">Laura</span>
                    <span class="logo-last">Damase</span>
                </a>
                <p class="subtitle">RÉALISATRICE & FILMMAKER</p>
            </div>

            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">
                <span class="hamburger"></span>
            </button>

            <ul class="nav-links" id="navLinks">
            </ul>

            <div class="social-icons">
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content landing-content" id="mainContent">
        <div class="logo-container" id="landingLogo">
            <a href="./" class="logo">
                <span class="logo-first">Laura</span>
                <span class="logo-last">Damase</span>
            </a>
            <p class="subtitle">RÉALISATRICE & FILMMAKER</p>
        </div>

        <section class="portfolio-grid" id="portfolioGrid" style="display: none;">
        </section>

        <section class="about-section" id="aboutSection" style="display: none;">
            <div class="about-container">
                <div class="about-image">
                    <img src="./images/laura.jpg" alt="Laura Damase" class="portrait-image">
                </div>
                <div class="about-content">
                    <h1 class="about-title">À Propos</h1>
                    <div class="about-text" id="aboutText">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Video Modal -->
    <div id="videoModal" class="video-modal" aria-hidden="true">
        <div class="video-modal-content">
            <button class="video-modal-close" aria-label="Fermer">&times;</button>
            <div class="video-modal-player" id="videoModalPlayer"></div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="./js/main.js"></script>
    <script>
        (function() {
            var carousel = document.getElementById('videoCarousel');
            var track = document.getElementById('videoTrack');
            var dotsContainer = document.getElementById('carouselDots');
            var prevBtn = document.getElementById('carouselPrev');
            var nextBtn = document.getElementById('carouselNext');
            var items = track ? track.querySelectorAll('.video-carousel-item') : [];
            var dots = dotsContainer ? dotsContainer.querySelectorAll('.dot') : [];

            var videoDurations = [5000, 4000, 5000, 4000, 9000]; // ms for each video
            var currentIndex = 0;
            var isTransitioning = false;
            var autoPlayTimer = null;
            var isHovered = false;

            // Video names/labels for accessibility
            var videoLabels = ['Vidéo 1', 'Vidéo 2', 'Vidéo 3', 'Vidéo 4a', 'Vidéo 4b'];

            function initCarousel() {
                if (!carousel || items.length === 0) return;

                // Create dots
                createDots();

                // Load first video
                loadVideo(0);

                // Start autoplay
                scheduleNext();

                // Event listeners
                if (prevBtn) prevBtn.addEventListener('click', prevVideo);
                if (nextBtn) nextBtn.addEventListener('click', nextVideo);

                carousel.addEventListener('mouseenter', function() { isHovered = true; });
                carousel.addEventListener('mouseleave', function() { isHovered = false; scheduleNext(); });

                // Touch/swipe support
                setupTouchEvents();

                // Hide carousel when navigating to portfolio
                var navLinks = document.querySelectorAll('.nav-link[data-filter]');
                navLinks.forEach(function(link) {
                    link.addEventListener('click', function() {
                        carousel.style.display = 'none';
                    });
                });
            }

            function createDots() {
                if (!dotsContainer) return;
                dotsContainer.innerHTML = '';
                for (var i = 0; i < items.length; i++) {
                    var dot = document.createElement('button');
                    dot.className = 'dot' + (i === 0 ? ' active' : '');
                    dot.setAttribute('aria-label', 'Aller à ' + videoLabels[i]);
                    dot.setAttribute('data-index', i);
                    dot.addEventListener('click', function() {
                        goToVideo(parseInt(this.getAttribute('data-index')));
                    });
                    dotsContainer.appendChild(dot);
                }
            }

            function loadVideo(index) {
                var item = items[index];
                if (!item) return;

                var iframe = item.querySelector('iframe');
                if (!iframe) return;

                var src = iframe.getAttribute('data-src');
                if (src && iframe.src !== src) {
                    iframe.src = src;
                }
            }

            function goToVideo(index) {
                if (isTransitioning || index === currentIndex) return;
                if (index < 0) index = items.length - 1;
                if (index >= items.length) index = 0;

                isTransitioning = true;

                // Update items
                items.forEach(function(item, i) {
                    item.classList.remove('active');
                });
                items[index].classList.add('active');

                // Load video
                loadVideo(index);

                // Update dots
                if (dotsContainer) {
                    var dotsAll = dotsContainer.querySelectorAll('.dot');
                    dotsAll.forEach(function(d, i) {
                        d.classList.toggle('active', i === index);
                    });
                }

                currentIndex = index;

                // Reset transition lock
                setTimeout(function() {
                    isTransitioning = false;
                }, 600);

                // Reset timer
                scheduleNext();
            }

            function nextVideo() {
                goToVideo(currentIndex + 1);
            }

            function prevVideo() {
                goToVideo(currentIndex - 1);
            }

            function scheduleNext() {
                if (autoPlayTimer) clearTimeout(autoPlayTimer);
                if (isHovered) return;
                autoPlayTimer = setTimeout(function() {
                    nextVideo();
                }, videoDurations[currentIndex]);
            }

            function setupTouchEvents() {
                var startX = 0;
                var startY = 0;

                carousel.addEventListener('touchstart', function(e) {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }, { passive: true });

                carousel.addEventListener('touchend', function(e) {
                    var endX = e.changedTouches[0].clientX;
                    var endY = e.changedTouches[0].clientY;
                    var diffX = endX - startX;
                    var diffY = endY - startY;

                    // Only swipe if horizontal movement is greater
                    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                        if (diffX > 0) prevVideo();
                        else nextVideo();
                    }
                }, { passive: true });
            }

            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (carousel.style.display === 'none') return;
                if (e.key === 'ArrowRight') nextVideo();
                if (e.key === 'ArrowLeft') prevVideo();
            });

            // Initialize when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initCarousel);
            } else {
                initCarousel();
            }
        })();
    </script>

</body>
</html>
