<body>
    <!-- Video Background (dual iframe for seamless transitions) -->
    <div class="video-background" id="videoBg">
        <iframe id="bgVideo1" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture"></iframe>
        <iframe id="bgVideo2" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture"></iframe>
    </div>

    <!-- Navigation Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo-container">
                <a href="./" class="logo">
                    <span class="logo-first">Laura</span>
                    <span class="logo-last">Damase</span>
                </a>
                <p class="subtitle">RÉALISATRICE & FILMMAKER</p>
            </div>

            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">
                <span class="hamburger"></span>
            </button>

            <ul class="nav-links" id="navLinks">
            </ul>

            <div class="social-icons">
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content landing-content" id="mainContent">
        <div class="logo-container" id="landingLogo">
            <a href="./" class="logo">
                <span class="logo-first">Laura</span>
                <span class="logo-last">Damase</span>
            </a>
            <p class="subtitle">RÉALISATRICE & FILMMAKER</p>
        </div>

        <section class="portfolio-grid" id="portfolioGrid" style="display: none;">
        </section>

        <section class="about-section" id="aboutSection" style="display: none;">
            <div class="about-container">
                <div class="about-image">
                    <img src="./images/laura.jpg" alt="Laura Damase" class="portrait-image">
                </div>
                <div class="about-content">
                    <h1 class="about-title">À Propos</h1>
                    <div class="about-text" id="aboutText">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Video Modal -->
    <div id="videoModal" class="video-modal" aria-hidden="true">
        <div class="video-modal-content">
            <button class="video-modal-close" aria-label="Fermer">&times;</button>
            <div class="video-modal-player" id="videoModalPlayer"></div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="./js/main.js"></script>
    <script>
        (function() {
            var videoBg = document.getElementById('videoBg');
            var bgVideo1 = document.getElementById('bgVideo1');
            var bgVideo2 = document.getElementById('bgVideo2');

            // Video playlist: [embedUrl, startSec, durationMs, isYouTube]
            var playlist = [
                ['https://www.youtube-nocookie.com/embed/uSwd2NAgF-E', 86, 5000, true],
                ['https://player.vimeo.com/video/1015174528', 120, 4000, false],
                ['https://player.vimeo.com/video/688364895', 980, 25000, false],
                ['https://player.vimeo.com/video/689078465', 846, 4000, false],
                ['https://player.vimeo.com/video/689078465', 1023, 9000, false]
            ];

            var currentIndex = 0;
            var activeSlot = 1; // alternates between 1 and 2
            var timer = null;
            var preloadTimer = null;

            function buildSrc(index) {
                var v = playlist[index];
                if (v[3]) {
                    var endSec = v[1] + Math.round(v[2] / 1000);
                    return v[0] + '?start=' + v[1] + '&end=' + endSec + '&autoplay=1&mute=1&loop=0&playsinline=1&controls=0&showinfo=0&rel=0&modestbranding=1';
                } else {
                    return v[0] + '?background=1&autopause=0&autoplay=1&muted=1&loop=0#t=' + v[1] + 's';
                }
            }

            function getActiveIframe() {
                return activeSlot === 1 ? bgVideo1 : bgVideo2;
            }

            function getInactiveIframe() {
                return activeSlot === 1 ? bgVideo2 : bgVideo1;
            }

            function switchVideo() {
                var active = getActiveIframe();
                var inactive = getInactiveIframe();
                inactive.style.opacity = '1';
                active.style.opacity = '0';
                activeSlot = activeSlot === 1 ? 2 : 1;
            }

            function advance() {
                // Preload next video into the iframe that will become inactive after switch
                var nextIndex = (currentIndex + 1) % playlist.length;
                getActiveIframe().src = buildSrc(nextIndex);

                // Advance to next
                currentIndex = nextIndex;
                switchVideo();

                if (timer) clearTimeout(timer);
                timer = setTimeout(advance, playlist[currentIndex][2]);
            }

            // Hide video when navigating away
            var navLinks = document.querySelectorAll('.nav-link[data-filter]');
            navLinks.forEach(function(link) {
                link.addEventListener('click', function() {
                    videoBg.style.display = 'none';
                    if (timer) clearTimeout(timer);
                });
            });

            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (videoBg.style.display === 'none') return;
                if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                    if (timer) clearTimeout(timer);
                    if (e.key === 'ArrowRight') {
                        currentIndex = (currentIndex + 1) % playlist.length;
                    } else {
                        currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                    }
                    // Load the current video into the newly active iframe
                    getActiveIframe().src = buildSrc(currentIndex);
                    switchVideo();
                    timer = setTimeout(advance, playlist[currentIndex][2]);
                }
            });

            // Initialize with first two videos preloaded
            if (bgVideo1 && bgVideo2) {
                bgVideo1.src = buildSrc(0);
                bgVideo2.src = buildSrc(1);
                bgVideo1.style.opacity = '1';
                bgVideo2.style.opacity = '0';
                activeSlot = 1;
                currentIndex = 1;
                timer = setTimeout(advance, playlist[1][2]);
            }
        })();
    </script>

</body>
</html>
