<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Laura Damase - Réalisatrice & Filmmaker. Portfolio de documentaires et reportages pour France 2, 13h15.">
    <title>Laura Damase | Réalisatrice & Filmmaker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Laura Damase | Réalisatrice & Filmmaker">
    <meta property="og:description" content="Portfolio de documentaires et reportages pour France Télévisions par Laura Damase.">
    <meta property="og:image" content="https://www.franceinfo.fr/pictures/QXgAkLvjQvqING_r3yHVfdhCtp0/1200x675/2025/07/17/13h15-250803-l-homme-et-la-vallee-6879031710fa6738414081.png">
    <meta property="og:url" content="https://lauradamase.github.io/laura/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    <!-- Theme Color -->
    <meta name="theme-color" content="#800020">
</head>
<body>
    <!-- Video Background -->
    <div class="video-background" id="videoBg">
        <iframe id="bgVideo" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture"></iframe>
    </div>

    <!-- Navigation Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo-container">
                <a href="./" class="logo">
                    <span class="logo-first">Laura</span>
                    <span class="logo-last">Damase</span>
                </a>
                <p class="subtitle">RÉALISATRICE & FILMMAKER</p>
            </div>

            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">
                <span class="hamburger"></span>
            </button>

            <ul class="nav-links" id="navLinks">
            </ul>

            <div class="social-icons">
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content landing-content" id="mainContent">
        <div class="logo-container" id="landingLogo">
            <a href="./" class="logo">
                <span class="logo-first">Laura</span>
                <span class="logo-last">Damase</span>
            </a>
            <p class="subtitle">RÉALISATRICE & FILMMAKER</p>
        </div>

        <section class="portfolio-grid" id="portfolioGrid" style="display: none;">
        </section>

        <section class="about-section" id="aboutSection" style="display: none;">
            <div class="about-container">
                <div class="about-image">
                    <img src="./images/laura.jpg" alt="Laura Damase" class="portrait-image">
                </div>
                <div class="about-content">
                    <h1 class="about-title">À Propos</h1>
                    <div class="about-text" id="aboutText">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Video Modal -->
    <div id="videoModal" class="video-modal" aria-hidden="true">
        <div class="video-modal-content">
            <button class="video-modal-close" aria-label="Fermer">&times;</button>
            <div class="video-modal-player" id="videoModalPlayer"></div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="./js/main.js"></script>
    <script>
        (function() {
            var bgVideo = document.getElementById('bgVideo');
            var videoBg = document.getElementById('videoBg');

            // Video playlist: [src, startMs, endMs, durationMs]
            var playlist = [
                ['https://www.youtube-nocookie.com/embed/uSwd2NAgF-E', 86000, 91000, 5000],
                ['https://player.vimeo.com/video/1015174528', 120000, 124000, 4000],
                ['https://player.vimeo.com/video/688364895', 980000, 985000, 5000],
                ['https://player.vimeo.com/video/689078465', 846000, 850000, 4000],
                ['https://player.vimeo.com/video/689078465', 1023000, 1032000, 9000]
            ];

            var currentIndex = 0;
            var timer = null;

            function buildSrc(index) {
                var v = playlist[index];
                if (v[0].indexOf('youtube') > -1) {
                    return v[0] + '?start=' + Math.floor(v[1]/1000) + '&end=' + Math.floor(v[2]/1000) + '&autoplay=1&mute=1&loop=0&playsinline=1&controls=0&showinfo=0';
                } else {
                    return v[0] + '?background=1&autopause=0&autoplay=1&muted=1&loop=0#t=' + (v[1]/1000) + ',' + (v[2]/1000);
                }
            }

            function loadVideo(index) {
                bgVideo.src = buildSrc(index);
            }

            function nextVideo() {
                loadVideo(currentIndex);
                if (timer) clearTimeout(timer);
                timer = setTimeout(function() {
                    currentIndex = (currentIndex + 1) % playlist.length;
                    nextVideo();
                }, playlist[currentIndex][3]);
            }

            // Hide video when navigating away
            var navLinks = document.querySelectorAll('.nav-link[data-filter]');
            navLinks.forEach(function(link) {
                link.addEventListener('click', function() {
                    videoBg.style.display = 'none';
                    if (timer) clearTimeout(timer);
                });
            });

            // Keyboard arrows
            document.addEventListener('keydown', function(e) {
                if (videoBg.style.display === 'none') return;
                if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex + 1) % playlist.length;
                    loadVideo(currentIndex);
                    if (timer) clearTimeout(timer);
                    timer = setTimeout(function() {
                        currentIndex = (currentIndex + 1) % playlist.length;
                        nextVideo();
                    }, playlist[currentIndex][3]);
                }
                if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                    loadVideo(currentIndex);
                    if (timer) clearTimeout(timer);
                    timer = setTimeout(function() {
                        currentIndex = (currentIndex + 1) % playlist.length;
                        nextVideo();
                    }, playlist[currentIndex][3]);
                }
            });

            // Start
            if (bgVideo) {
                loadVideo(0);
                currentIndex = 1;
                timer = setTimeout(function() {
                    nextVideo();
                }, playlist[0][3]);
            }
        })();
    </script>

</body>
</html>
