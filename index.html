<body>
    <!-- Vimeo Background Video -->

    <!-- JavaScript -->
    <script src="./js/main.js"></script>
    <script>
        (function() {
            var iframe = document.getElementById('vimeoIframe');
            var videoBg = document.getElementById('videoBg');
            var player;

            function initVideo() {
                player = Vimeo.Player(iframe);
                player.on('timeupdate', function(data) {
                    if (data.seconds >= 10) {
                        player.setCurrentTime(0).then(function() {
                            player.play();
                        });
                    }
                });
            }

            iframe.src = 'https://player.vimeo.com/video/688364895?background=1&autopause=0&autoplay=1&muted=1&loop=1#t=16m20s';

            if (window.Vimeo) {
                initVideo();
            } else {
                var script = document.createElement('script');
                script.src = 'https://player.vimeo.com/api/player.js';
                script.onload = initVideo;
                document.head.appendChild(script);
            }
        })();
    </script>

</body>
